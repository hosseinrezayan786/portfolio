<!DOCTYPE html>
<html>
<head>
  <base href="/portfolio/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <meta
    name="description"
    content="Hossein Rezayan — Flutter Developer Portfolio."
  >

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black"
  >
  <meta
    name="apple-mobile-web-app-title"
    content="Hossein Rezayan"
  >

  <link rel="apple-touch-icon" href="favicon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Browser Title -->
  <title>Hossein Rezayan | Flutter Developer</title>

  <link rel="manifest" href="manifest.json">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0D1117;
      overflow: hidden;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #0D141F;

      opacity: 1;
      visibility: visible;

      transition:
        opacity 450ms ease,
        visibility 450ms ease;
    }

    #loading-screen.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      text-align: center;
    }

    .logo {
      width: 48px;
      height: 48px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 24px;

      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 18px;

      color: white;

      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;

      animation:
        logoPulse 1.6s ease-in-out infinite;
    }

    .name {
      color: white;

      font-size: 20px;
      font-weight: 700;

      letter-spacing: 2px;

      margin-bottom: 8px;
    }

    .role {
      color: rgba(255, 255, 255, 0.6);

      font-size: 13px;
      letter-spacing: 1.5px;

      margin-bottom: 28px;
    }

    .loader {
      width: 32px;
      height: 32px;

      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: white;

      border-radius: 50%;

      animation:
        spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes logoPulse {
      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.05);
        opacity: 0.75;
      }
    }
  </style>
</head>

<body>

  <!-- Initial Loading Screen -->
  <div id="loading-screen">
    <div class="loading-content">

      <div class="logo">
        HR
      </div>

      <div class="name">
        HOSSEIN REZAYAN
      </div>

      <div class="role">
        FLUTTER DEVELOPER
      </div>

      <div class="loader"></div>

    </div>
  </div>

  <!-- Flutter -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- Remove loading screen when Flutter is ready -->
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loadingScreen =
        document.getElementById('loading-screen');

      if (loadingScreen) {
        loadingScreen.classList.add('hide');

        setTimeout(function () {
          loadingScreen.remove();
          document.body.style.overflow = 'auto';
        }, 500);
      }
    });
  </script>

</body>
</html>
